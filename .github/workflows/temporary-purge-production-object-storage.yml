name: Temporary purge production object storage

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact current main commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: temporary-purge-production-object-storage
  cancel-in-progress: false

jobs:
  purge:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NOTION_API_VERSION: '2026-03-11'
      NOTION_STORAGE_DATA_SOURCE_ID: '33a70b5a-c477-409f-ba61-78679279ce7e'
    steps:
      - uses: actions/checkout@v7

      - name: Bind purge approval to exact main revision
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test -n "$NOTION_API_TOKEN"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run production:check -- config apps/api/wrangler.production.jsonc

      - name: Move every active production object index page to trash
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const root = 'https://api.notion.com/v1';
          const headers = {
            Authorization: `Bearer ${process.env.NOTION_API_TOKEN}`,
            'Notion-Version': process.env.NOTION_API_VERSION,
            'Content-Type': 'application/json',
          };
          const dataSourceId = process.env.NOTION_STORAGE_DATA_SOURCE_ID;

          async function request(path, init = {}) {
            const response = await fetch(`${root}${path}`, { ...init, headers: init.headers ?? headers });
            if (!response.ok) throw new Error(`Notion API ${response.status}`);
            return response.json();
          }

          async function listActivePages() {
            const pages = [];
            let cursor;
            do {
              const body = {
                filter: { property: 'State', select: { equals: 'active' } },
                page_size: 100,
                ...(cursor ? { start_cursor: cursor } : {}),
              };
              const result = await request(`/data_sources/${encodeURIComponent(dataSourceId)}/query`, {
                method: 'POST',
                body: JSON.stringify(body),
              });
              for (const page of result.results ?? []) {
                if (typeof page?.id === 'string') pages.push(page.id);
              }
              cursor = result.has_more ? result.next_cursor : undefined;
            } while (cursor);
            return pages;
          }

          const active = await listActivePages();
          for (const id of active) {
            await request(`/pages/${encodeURIComponent(id)}`, {
              method: 'PATCH',
              body: JSON.stringify({ in_trash: true }),
            });
          }
          const remaining = await listActivePages();
          if (remaining.length !== 0) throw new Error(`active object indexes remain: ${remaining.length}`);
          console.log(`Production object storage purge complete: ${active.length} active object index page(s) moved to trash; 0 active remain.`);
          NODE

      - name: Record non-sensitive purge summary
        run: |
          printf '### Production object storage purge\n- Data source: `%s`\n- Active object indexes remaining: `0`\n- Notion FileUpload physical deletion: unavailable via current public API\n' "$NOTION_STORAGE_DATA_SOURCE_ID" >> "$GITHUB_STEP_SUMMARY"
