name: Production D1 migration

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact current main commit (40 hexadecimal characters)
        required: true
        type: string
      migration_record:
        description: Reviewed backup/schema/migration evidence reference (no secrets)
        required: true
        type: string
      database_id:
        description: Confirm the exact production D1 database UUID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-d1-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v7

      - name: Bind migration approval to exact main revision
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          MIGRATION_RECORD: ${{ inputs.migration_record }}
          CONFIRMED_DATABASE_ID: ${{ inputs.database_id }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$MIGRATION_RECORD"
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CONFIRMED_DATABASE_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]
          test -n "$CLOUDFLARE_API_TOKEN"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run check

      - name: Validate tracked production config and confirmed database
        env:
          CONFIRMED_DATABASE_ID: ${{ inputs.database_id }}
        run: |
          set -euo pipefail
          npm run p7 -- config apps/api/wrangler.production.jsonc
          CONFIG_DATABASE_ID="$(node --input-type=module -e 'import {readFileSync} from "node:fs"; const c=JSON.parse(readFileSync("apps/api/wrangler.production.jsonc","utf8")); process.stdout.write(c.d1_databases[0].database_id);')"
          test "$CONFIG_DATABASE_ID" = "$CONFIRMED_DATABASE_ID"

      - name: Show pending production migrations
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm exec -- wrangler d1 migrations list DB --remote --config wrangler.production.jsonc

      - name: Apply reviewed production migrations
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm exec -- wrangler d1 migrations apply DB --remote --config wrangler.production.jsonc

      - name: Verify production migration state
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm exec -- wrangler d1 migrations list DB --remote --config wrangler.production.jsonc

      - name: Record migration summary
        run: |
          printf '### Production D1 migration\n- Commit: `%s`\n- Database: `%s`\n- Migration command: PASS\n' "${{ inputs.release_sha }}" "${{ inputs.database_id }}" >> "$GITHUB_STEP_SUMMARY"
