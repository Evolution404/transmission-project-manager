name: Production release

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact current main commit (40 hexadecimal characters)
        required: true
        type: string
      release_record:
        description: Reviewed release/backup/schema evidence reference (no secrets)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v7

      - name: Bind approval to exact main revision and required secrets
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_RECORD: ${{ inputs.release_record }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AUTH_CREDENTIAL_PEPPER: ${{ secrets.AUTH_CREDENTIAL_PEPPER }}
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_RECORD"
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$AUTH_CREDENTIAL_PEPPER"
          test -n "$NOTION_API_TOKEN"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run p7 -- config apps/api/wrangler.production.jsonc

      - name: Materialize ephemeral Worker secrets
        env:
          AUTH_CREDENTIAL_PEPPER: ${{ secrets.AUTH_CREDENTIAL_PEPPER }}
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
        run: |
          set -euo pipefail
          SECRETS_FILE="$RUNNER_TEMP/worker-secrets.json"
          SECRETS_FILE="$SECRETS_FILE" node --input-type=module -e 'import {chmodSync,writeFileSync} from "node:fs"; const values={AUTH_CREDENTIAL_PEPPER:process.env.AUTH_CREDENTIAL_PEPPER,NOTION_API_TOKEN:process.env.NOTION_API_TOKEN}; if(Object.values(values).some(v=>!v)) process.exit(1); writeFileSync(process.env.SECRETS_FILE,JSON.stringify(values),{mode:0o600}); chmodSync(process.env.SECRETS_FILE,0o600);'
          echo "WORKER_SECRETS_FILE=$SECRETS_FILE" >> "$GITHUB_ENV"

      - name: Package exact approved revision
        working-directory: apps/api
        run: npm exec -- wrangler deploy --dry-run --config wrangler.production.jsonc --secrets-file "$WORKER_SECRETS_FILE" --outdir dist-production-release

      - name: Recheck approved main revision before publication
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"

      - name: Publish Worker, bindings and Worker secrets as one version
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm exec -- wrangler deploy --config wrangler.production.jsonc --secrets-file "$WORKER_SECRETS_FILE"

      - name: Verify custom domain and health
        run: |
          set -euo pipefail
          DOMAIN="$(node --input-type=module -e 'import {readFileSync} from "node:fs"; const c=JSON.parse(readFileSync("apps/api/wrangler.production.jsonc","utf8")); process.stdout.write(c.routes[0].pattern);')"
          test -n "$DOMAIN"
          HEALTH_FILE="$(mktemp)"
          trap 'rm -f "$HEALTH_FILE"' EXIT
          HEALTH_OK=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --connect-timeout 10 --max-time 20 "https://${DOMAIN}/api/health" -o "$HEALTH_FILE" \
              && HEALTH_FILE="$HEALTH_FILE" node --input-type=module -e 'import {readFileSync} from "node:fs"; const body=JSON.parse(readFileSync(process.env.HEALTH_FILE,"utf8")); if (body?.ok !== true || body?.data?.service !== "transmission-project-manager" || body?.data?.schema?.ready !== true) process.exit(1);'; then
              HEALTH_OK=1
              break
            fi
            sleep 2
          done
          test "$HEALTH_OK" = 1
          printf '### Production release\n- Commit: `%s`\n- Domain: `%s`\n- `/api/health`: PASS\n' "${{ inputs.release_sha }}" "$DOMAIN" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove ephemeral Worker secret file
        if: always()
        run: rm -f "$RUNNER_TEMP/worker-secrets.json"
