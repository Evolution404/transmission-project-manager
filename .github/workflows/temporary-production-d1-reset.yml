name: Temporary production D1 reset

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact current main commit
        required: true
        type: string
      old_database_id:
        description: Existing production D1 UUID
        required: true
        type: string
      new_database_name:
        description: Fresh production D1 name
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: temporary-production-d1-reset
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WRANGLER_SEND_METRICS: 'false'
      ACCOUNT_ID: '642d30520d6c494dd418b1f4b3853aa6'
    steps:
      - uses: actions/checkout@v7

      - name: Bind reset approval to exact main revision
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          OLD_DATABASE_ID: ${{ inputs.old_database_id }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$OLD_DATABASE_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]
          test -n "$CLOUDFLARE_API_TOKEN"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run production:check -- config apps/api/wrangler.production.jsonc

      - name: Export member rows to an ephemeral runner file
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npm exec -- wrangler d1 export DB --remote --config wrangler.production.jsonc \
            --table members --no-schema --output "$RUNNER_TEMP/members.sql"
          test -s "$RUNNER_TEMP/members.sql"
          chmod 600 "$RUNNER_TEMP/members.sql"

      - name: Create fresh D1 and apply current baseline
        id: fresh
        env:
          NEW_DATABASE_NAME: ${{ inputs.new_database_name }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          CREATE_JSON="$RUNNER_TEMP/new-d1.json"
          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/d1/database" \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --data "$(node --input-type=module -e 'process.stdout.write(JSON.stringify({name:process.env.NEW_DATABASE_NAME}))')" \
            > "$CREATE_JSON"
          NEW_DATABASE_ID="$(CREATE_JSON="$CREATE_JSON" node --input-type=module -e 'import {readFileSync} from "node:fs"; const p=JSON.parse(readFileSync(process.env.CREATE_JSON,"utf8")); if(p?.success!==true || !p?.result?.uuid) process.exit(1); process.stdout.write(p.result.uuid);')"
          [[ "$NEW_DATABASE_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]
          echo "database_id=$NEW_DATABASE_ID" >> "$GITHUB_OUTPUT"

          NEW_DATABASE_ID="$NEW_DATABASE_ID" NEW_DATABASE_NAME="$NEW_DATABASE_NAME" node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const config = JSON.parse(readFileSync('apps/api/wrangler.production.jsonc', 'utf8'));
          config.d1_databases[0].database_id = process.env.NEW_DATABASE_ID;
          config.d1_databases[0].database_name = process.env.NEW_DATABASE_NAME;
          writeFileSync('apps/api/wrangler.production-reset.jsonc', JSON.stringify(config, null, 2));
          NODE
          (cd apps/api && npm exec -- wrangler d1 migrations apply DB --remote --config wrangler.production-reset.jsonc)

      - name: Restore only zhangsan account into the fresh D1
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npm exec -- wrangler d1 execute DB --remote --yes --config wrangler.production-reset.jsonc \
            --file "$RUNNER_TEMP/members.sql"
          npm exec -- wrangler d1 execute DB --remote --yes --config wrangler.production-reset.jsonc \
            --command "DELETE FROM members WHERE lower(username) <> lower('zhangsan');"
          npm exec -- wrangler d1 execute DB --remote --yes --config wrangler.production-reset.jsonc \
            --command "SELECT username,role,enabled,must_change_password,CASE WHEN locked_until IS NULL THEN 0 ELSE 1 END AS locked FROM members;"
          MEMBER_COUNT="$(npm exec -- wrangler d1 execute DB --remote --json --config wrangler.production-reset.jsonc --command "SELECT COUNT(*) AS count FROM members WHERE lower(username)=lower('zhangsan');" | node --input-type=module -e 'let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s); const r=Array.isArray(p)?p[0]:p; process.stdout.write(String(r?.results?.[0]?.count ?? ""));});')"
          test "$MEMBER_COUNT" = "1"

      - name: Verify fresh D1 is empty and current
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEW_DATABASE_ID: ${{ steps.fresh.outputs.database_id }}
          NEW_DATABASE_NAME: ${{ inputs.new_database_name }}
        run: |
          set -euo pipefail
          npm exec -- wrangler d1 execute DB --remote --yes --config wrangler.production-reset.jsonc \
            --command "SELECT (SELECT COUNT(*) FROM demands) AS demands,(SELECT COUNT(*) FROM projects) AS projects,(SELECT COUNT(*) FROM transmission_lines) AS lines,(SELECT name FROM d1_migrations ORDER BY id DESC LIMIT 1) AS migration;"
          printf '### Fresh production D1 prepared\n- Name: `%s`\n- Database ID: `%s`\n- Preserved account: `zhangsan`\n- Business data: empty\n- Migration: `0001_initial_schema.sql`\n' \
            "$NEW_DATABASE_NAME" "$NEW_DATABASE_ID" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove ephemeral member export
        if: always()
        run: rm -f "$RUNNER_TEMP/members.sql" "$RUNNER_TEMP/new-d1.json" apps/api/wrangler.production-reset.jsonc
