name: Production promote

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-promote
  cancel-in-progress: false

jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WRANGLER_SEND_METRICS: 'false'
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Bind approval to exact main revision and required secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AUTH_CREDENTIAL_PEPPER: ${{ secrets.AUTH_CREDENTIAL_PEPPER }}
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$AUTH_CREDENTIAL_PEPPER"
          test -n "$NOTION_API_TOKEN"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run production:check -- config apps/api/wrangler.production.jsonc

      - name: Materialize ephemeral Worker secrets
        env:
          AUTH_CREDENTIAL_PEPPER: ${{ secrets.AUTH_CREDENTIAL_PEPPER }}
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
        run: |
          set -euo pipefail
          SECRETS_FILE="$RUNNER_TEMP/worker-secrets.json"
          SECRETS_FILE="$SECRETS_FILE" node --input-type=module -e 'import {chmodSync,writeFileSync} from "node:fs"; const values={AUTH_CREDENTIAL_PEPPER:process.env.AUTH_CREDENTIAL_PEPPER,NOTION_API_TOKEN:process.env.NOTION_API_TOKEN}; if(Object.values(values).some(v=>!v)) process.exit(1); writeFileSync(process.env.SECRETS_FILE,JSON.stringify(values),{mode:0o600}); chmodSync(process.env.SECRETS_FILE,0o600);'
          echo "WORKER_SECRETS_FILE=$SECRETS_FILE" >> "$GITHUB_ENV"

      - name: Package exact approved revision
        working-directory: apps/api
        run: npm exec -- wrangler deploy --dry-run --config wrangler.production.jsonc --secrets-file "$WORKER_SECRETS_FILE" --outdir dist-production-promote

      - name: Recheck approved main revision before production mutation
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"

      - name: Preserve data and promote production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash scripts/production/promote.sh

      - name: Remove ephemeral files
        if: always()
        run: rm -rf "$RUNNER_TEMP/tpm-production-promote" "$RUNNER_TEMP/worker-secrets.json"

